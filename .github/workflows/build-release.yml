name: Build Release APK

on:
  push:
    branches: [ "main", "copilot/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APK to artifacts directory
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/stauende-release.apk

      - name: Commit APK to artifacts directory
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/stauende-release.apk
          git diff --cached --quiet || git commit -m "ci: update release APK in artifacts directory [skip ci]"
          git push

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: stauende-release-apk
          path: artifacts/stauende-release.apk
          retention-days: 30
